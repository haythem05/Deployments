apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backoffice-ingress
  namespace: microservices
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: backoffice.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backoffice-service
            port:
              number: 80

      - path: /frontoffice
        pathType: Prefix
        backend:
          service:
            name: backoffice-service
            port:
              number: 80