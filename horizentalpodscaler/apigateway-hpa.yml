apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 45   
      policies:
      - type: Percent
        value: 50    
        periodSeconds: 45
      - type: Pods
        value: 1        
        periodSeconds: 45
    scaleDown:
      stabilizationWindowSeconds: 180  
      policies:
      - type: Percent
        value: 30      
        periodSeconds: 60