apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: login-microservice-hpa
  namespace: microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: login-microservice
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120  
      policies:
      - type: Percent
        value: 50     
        periodSeconds: 60
      - type: Pods
        value: 1      
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  
      policies:
      - type: Percent
        value: 50     
        periodSeconds: 120          
