apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-microservice-hpa
  namespace: microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-microservice
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:             
    scaleUp:
      stabilizationWindowSeconds: 30   
      policies:
      - type: Percent
        value: 50     
        periodSeconds: 30
      - type: Pods  
        value: 2        
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5min before scaling down
      policies:
      - type: Percent
        value: 25       
        periodSeconds: 60          
