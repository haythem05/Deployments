kind: ServiceAccount
apiVersion: v1
metadata:
  namespace: microservices
  name: account-microservices-manager-ohaya

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: microservices
  name: role-microservices-manager-ohaya
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["chaos-mesh.org"]
  resources: [ "*" ]
  verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-microservices-manager-ohaya
  namespace: microservices
subjects:
- kind: ServiceAccount
  name: account-microservices-manager-ohaya
  namespace: microservices
roleRef:
  kind: Role
  name: role-microservices-manager-ohaya
  apiGroup: rbac.authorization.k8s.io
