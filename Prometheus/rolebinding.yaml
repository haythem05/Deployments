apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-service-binding
  namespace: microservices
subjects:
  - kind: ServiceAccount
    name: default
    namespace: prometheus  # This must match the service account namespace
roleRef:
  kind: Role
  name: prometheus-service-reader
  apiGroup: rbac.authorization.k8s.io
